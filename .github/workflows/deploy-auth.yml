# 로그인 유지 서버(server/)를 Cloudflare Workers에 배포해요.
# 승인 단계 — 이 잡이 쓰는 GitHub 환경: server. 환경에 필수 검토자를 걸어 두면 실행 직전에 멈추고, 저장소 주인이 승인해야 비밀값을 받아 진행해요.
#   비밀값은 저장소 Secrets가 아니라 Settings → Environments → server → Environment secrets에 둬요.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_SECRET
# ENC_KEY(갱신 토큰 암호화 키)는 처음 배포할 때 자동으로 만들어 Cloudflare에만 저장해요. 어디에도 출력하지 않아요.
name: Deploy auth server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-auth.yml', 'picker.html', 'picker.js', 'privacy.html', 'support.html']
  workflow_dispatch:

concurrency: deploy-auth

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: server   # 승인 후에만 클라우드플레어 토큰과 구글 비밀값을 받아요
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DB_NAME: alllever-asset-auth
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GOOGLE_CLIENT_SECRET" ] || missing="$missing GOOGLE_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::error::저장소 Secrets가 없어요:$missing (SERVER_SETUP.md 참고)"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - name: D1 database (create if missing)
        run: |
          id=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DB_NAME"
            id=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::D1 데이터베이스를 만들지 못했어요"; exit 1; }
          sed -i "s/__D1_ID__/$id/" wrangler.toml
      - name: Migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Pages for the app (alllever.app)
        run: mkdir -p site/fonts && cp -r home/. site/ && cp ../picker.html ../picker.js ../privacy.html ../support.html ../icon-180.png site/ && cp ../fonts/PretendardVariable.subset.woff2 site/fonts/
      - name: Deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
      - name: Secrets
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          if ! npx wrangler secret list | grep -q '"ENC_KEY"'; then
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put ENC_KEY
          fi
      - name: Health check
        run: |
          sleep 5
          curl -fsS "$WORKER_URL/health"
          {
            echo "### 로그인 서버 배포 완료"
            echo ""
            echo "- 서버 주소: \`$WORKER_URL\`"
            echo "- 구글 클라이언트의 승인된 리디렉션 URI: \`$WORKER_URL/auth/callback\`"
          } >> "$GITHUB_STEP_SUMMARY"
