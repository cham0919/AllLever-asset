# 아이폰·안드로이드 앱 빌드 확인 (서명 없이). 웹 버전(GitHub Pages) 배포와는 따로 돌아요.
# 결과물: 안드로이드 설치 파일(APK), 아이폰 시뮬레이터 실행 화면 캡처 — Actions 실행 결과의 Artifacts에서 받을 수 있어요.
name: App build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'theme-boot.js'
      - 'js/**'
      - 'fonts/**'
      - 'vendor/**'
      - 'android/**'
      - 'ios/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'tools/build-www.mjs'
      - '.github/workflows/app-build.yml'

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 빌드 기록(로그 끝부분)을 ci-android 브랜치에 올리기 위해서만 써요
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../logs
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../logs/android-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymuscle-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Push build log to ci-android branch
        if: always()
        run: |
          set -e
          mkdir -p out; tail -300 logs/android-build.log > out/android-build.log 2>/dev/null || echo "no log" > out/android-build.log
          cd out; git init -q -b ci-android
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -qm "안드로이드 빌드 기록 ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-android

  ios:
    runs-on: macos-15
    permissions:
      contents: write   # 시뮬레이터 캡처를 ci-screens 브랜치에 올리기 위해서만 써요
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run sync
      - name: Build for simulator (no signing)
        run: |
          set -o pipefail
          mkdir -p shots
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > xcb.log 2>&1 || { grep -E "error:|warning: .*(Swift|swift)" xcb.log | head -60 > shots/ios-build-errors.log; tail -80 xcb.log >> shots/ios-build-errors.log; exit 1; }
          tail -20 xcb.log
      - name: Run in simulator and take screenshots
        run: |
          set -e
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2[0-9]' | grep -v Plus | grep -v Max | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "simulator: $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl launch "$DEV" com.alllever.asset; sleep 12
          xcrun simctl io "$DEV" screenshot shots/ios-light.png
          xcrun simctl terminate "$DEV" com.alllever.asset || true
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl launch "$DEV" com.alllever.asset; sleep 10
          xcrun simctl io "$DEV" screenshot shots/ios-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymuscle-ios-screens
          path: shots/
      - name: Push screenshots to ci-screens branch
        if: always()
        run: |
          set -e
          mkdir -p shots; cd shots; [ -n "$(ls -A)" ] || echo "no output" > empty.txt
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -qm "iOS 시뮬레이터 캡처 ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
