name = "alllever-asset-auth"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true   # 예전 주소(…workers.dev): 1.0.39 이하 앱이 쓰고 있어서 당분간 유지
routes = [
  { pattern = "auth.alllever.app", custom_domain = true },   # 로그인 서버
  { pattern = "alllever.app", custom_domain = true },        # 앱이 여는 안내 페이지 (개인정보·지원·시트 선택)
]

# 앱이 여는 웹 페이지: 배포할 때 저장소 루트의 picker.html·privacy.html 등을 site/로 복사해서 함께 올려요
[assets]
directory = "./site"
html_handling = "none"   # 주소 그대로 열기 (picker.html을 /picker로 돌리지 않기)

[vars]
GOOGLE_CLIENT_ID = "919106003112-de97gm5uit7f9imrgrusrugj6t4g9v0s.apps.googleusercontent.com"
# 로그인 후 돌아갈 수 있는 앱 주소 (쉼표로 구분)
ALLOWED_RETURN = "https://cham0919.github.io/AllLever-asset/"
# 아이폰·안드로이드 앱으로 돌아오는 주소 (정확히 일치)와 앱 화면의 출처 (아이폰 capacitor://localhost, 안드로이드 https://localhost)
APP_RETURN = "com.alllever.asset://auth"
APP_ORIGINS = "capacitor://localhost,https://localhost"

[[d1_databases]]
binding = "DB"
database_name = "alllever-asset-auth"
database_id = "__D1_ID__"   # 배포할 때 GitHub Actions가 채움
migrations_dir = "migrations"

# IP당 요청 수 제한: 로그인 시작/콜백 분당 20회, 토큰 발급 분당 60회
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "TOKEN_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["17 18 * * *"]   # 매일 03:17 (한국 시간) 오래된 세션 정리
