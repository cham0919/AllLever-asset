# 아이폰 앱을 서명해서 TestFlight(App Store Connect)에 올려요. Actions 탭에서 "Run workflow"로 직접 실행해요.
# 필요한 저장소 Secrets (값은 채팅이나 코드에 넣지 말고 GitHub 저장소 설정에만 넣어요):
#   ASC_KEY_ID        App Store Connect API 키의 Key ID
#   ASC_ISSUER_ID     App Store Connect API의 Issuer ID
#   ASC_PRIVATE_KEY   내려받은 .p8 파일의 내용 전체 (-----BEGIN PRIVATE KEY----- 부터 끝까지)
#   APPLE_TEAM_ID     애플 개발자 팀 ID (10자리)
# 빌드 번호는 실행할 때마다 자동으로 올라가요. 버전(예: 1.0.0)은 package.json의 version을 써요.
name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: write   # 실패했을 때 오류 기록을 ci-release 브랜치에 남기기 위해서만 써요

concurrency: ios-testflight

jobs:
  testflight:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          missing=""
          for k in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then echo "::error::저장소 Secrets가 없어요:$missing"; mkdir -p rel; echo "missing secrets:$missing" > rel/result.txt; exit 1; fi
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run sync
      - name: API key file
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (서명은 업로드 단계에서 배포용 인증서로)
        run: |
          set -o pipefail; mkdir -p rel
          VER=$(node -p "require('./package.json').version"); BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "version $VER build $BUILD · $(xcodebuild -version | head -1)" | tee rel/result.txt
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" > rel/archive.log 2>&1 \
            || { grep -E "error:|Error|failed" rel/archive.log | head -40 >> rel/result.txt; exit 1; }
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > rel/upload.log 2>&1 \
            || { grep -E "error:|Error|failed|ERROR" rel/upload.log | head -40 >> rel/result.txt; exit 1; }
          echo "uploaded OK" >> rel/result.txt
          echo "### TestFlight 업로드 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect에서 처리(10~30분)가 끝나면 TestFlight 탭에 빌드가 보여요." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up key
        if: always()
        run: rm -rf ~/.appstoreconnect
      - name: Push result to ci-release branch (no secrets)
        if: always()
        run: |
          mkdir -p rel; cd rel; rm -f archive.log upload.log; [ -f result.txt ] || echo "no result" > result.txt
          git init -q -b ci-release
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -qm "TestFlight 결과 ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-release
